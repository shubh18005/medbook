server.port=${PORT:4001}

# H2 file-based database — creates a file under ./data/, no separate DB server needed.
spring.datasource.url=jdbc:h2:file:./data/medbookdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Optional: browse the DB at http://localhost:4001/h2-console while the app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT secret — CHANGE THIS before deploying anywhere public. Must be at least 32
# characters (256 bits) for the HS256 algorithm used in JwtUtil.
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-string-before-deploying}
jwt.expiration-ms=604800000

# ---------------------------------------------------------------------------
# Feedback study (quality gate + rewards) — see synopsis Sections 5.2.2 / 5.2.3.
# These are the "design parameters" the plan says are fixed on the pilot and
# then reported with the results. Weights must sum to 1 (checked at startup).
# Q = w-detail*D + w-unique*U + w-consistency*C ; group D is rewarded only if Q >= threshold.
# ---------------------------------------------------------------------------
study.quality.w-detail=0.4
study.quality.w-unique=0.3
study.quality.w-consistency=0.3
study.quality.threshold=0.75

# Simulated rewards. Keep points and discount comparable in value so that the
# B-vs-C comparison reflects reward TYPE, not reward size.
study.reward.points=50
study.reward.discount-percent=10
# What group D receives when it passes the gate: points | discount
study.reward.group-d-type=points

study.feedback.max-text-length=1000

# Trained sentiment model for the C (rating-text consistency) part of the quality score.
# Start it with:  cd analysis && python -m medbook_analysis.serve --model tfidf-svm --train-data data/labelled.csv
# Leave empty to keep using the built-in word list. Must point to a LOCAL service (patient text stays on this machine).
study.sentiment.model-url=http://127.0.0.1:8001
